<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Drum Verify — Printable QR Codes</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #fff; }
    .sheet { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
    .card {
      border: 2px solid #333;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      width: 200px;
    }
    .card img.qr { width: 160px; height: 160px; }
    .card img.thumb { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; }
    .card h3 { margin: 6px 0 2px; font-size: 0.95rem; }
    .card p { color: #666; font-size: 0.75rem; margin: 0; }
    .sku { font-family: monospace; background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
    .print-btn {
      display: block; margin: 16px auto; padding: 10px 24px;
      font-size: 1rem; cursor: pointer; background: #16213e; color: #fff;
      border: none; border-radius: 6px;
    }
    @media print {
      .print-btn { display: none; }
      body { padding: 0; }
      .card { width: 170px; break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <h1 style="text-align:center; font-size:1.4rem;">🖨 Drum Verify — Loading Dock QR Codes</h1>
  <p style="text-align:center; color:#666; font-size:0.85rem;">Tape these to loading sheets. Scan with any phone camera.</p>
  <button class="print-btn" onclick="window.print()">Print Sheet</button>

  <div class="sheet" id="sheet"></div>

  <script>
    const products = [
      { sku: 'DRUM-WHITE-RIDGES', name: 'White Ribbed Drum', img: 'drums/drum_white_ridges.jpg', desc: 'Ridged body, molded handles' },
      { sku: 'DRUM-WHITE-SMOOTH', name: 'White Smooth Drum', img: 'drums/drum_white_smooth.jpg', desc: 'Smooth body, blue stand' },
      { sku: 'DRUM-WHITE-CART',   name: 'White Drum on Cart', img: 'drums/drum_white_cart.jpg', desc: 'Narrow neck, red cart' },
      { sku: 'DRUM-WHITE-CLIPBOARD', name: 'White Drum (Clipboard)', img: 'drums/drum_white_clipboard.jpg', desc: 'Clipboard on top for scale' },
      { sku: 'DRUM-BLUE-CART',    name: 'Blue Drum on Cart', img: 'drums/drum_blue_cart.jpg', desc: 'Blue drum + lid, on cart' },
      { sku: 'DRUM-BLUE-PALLET',  name: 'Blue Drum on Pallet', img: 'drums/drum_blue_pallet.jpg', desc: 'Two blue drums, pallet jack' }
    ];

    const sheet = document.getElementById('sheet');
    products.forEach(p => {
      const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent('sku:' + p.sku);
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <img class="thumb" src="${p.img}" alt="${p.name}">
        <img class="qr" src="${qr}" alt="QR">
        <h3>${p.name}</h3>
        <p><span class="sku">${p.sku}</span></p>
        <p>${p.desc}</p>
      `;
      sheet.appendChild(div);
    });
  </script>
</body>
</html>
